
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="1029作業聯絡表單">
  <title>聯絡我們｜1029作業</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .form-status {
      margin-top: 12px;
      padding: 12px;
      border-radius: 8px;
      display: none;
    }
    .form-status.show {
      display: block;
    }
    .form-status.error {
      background: #fff0f0;
      color: #a32323;
    }
    .form-status.info {
      background: #fff4e5;
      color: #815313;
    }
    .form-status.success {
      background: #eaf8ef;
      color: #216b3b;
    }
    .contact-form button:disabled {
      opacity: .6;
      cursor: wait;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <a class="logo" href="index.html">1029作業</a>
    <nav>
      <a href="index.html">首頁</a>
      <a href="about.html">公司介紹</a>
      <a class="active" href="contact.html">聯絡我們</a>
    </nav>
  </header>

  <main class="page contact-page">
    <p class="eyebrow">CONTACT</p>
    <h1>聯絡我們</h1>
    <p class="lead">請填寫以下資料，送出後我們會盡快回覆。</p>

    <form
      id="contact-form"
      action="https://formsubmit.co/doratsai0711@gmail.com"
      method="POST"
      class="contact-form"
    >
      <input type="hidden" name="_subject" value="1029作業｜收到新的聯絡表單">
      <input type="hidden" name="_template" value="table">

      <label for="from_name">姓名 <span>*</span></label>
      <input
        id="from_name"
        name="姓名"
        type="text"
        autocomplete="name"
        required
        placeholder="請輸入姓名"
      >

      <label for="phone">電話 <span>*</span></label>
      <input
        id="phone"
        name="電話"
        type="tel"
        autocomplete="tel"
        required
        placeholder="請輸入聯絡電話"
      >

      <label for="reply_to">Email <span>*</span></label>
      <input
        id="reply_to"
        name="Email"
        type="email"
        autocomplete="email"
        required
        placeholder="請輸入電子郵件"
      >

      <label for="message">聯絡內容 <span>*</span></label>
      <textarea
        id="message"
        name="聯絡內容"
        rows="6"
        required
        placeholder="請輸入聯絡內容"
      ></textarea>

      <button id="submit-button" class="button" type="submit">
        送出表單
      </button>

      <p id="form-status" class="form-status" role="status" aria-live="polite"></p>

      <p class="form-note">
        第一次使用時，請先至收件信箱完成 FormSubmit 驗證。
        請勿填寫密碼或其他敏感資訊。
      </p>
    </form>
  </main>

  <footer>© 2026 1029作業｜All rights reserved.</footer>

  <script>
    const form = document.getElementById("contact-form");
    const button = document.getElementById("submit-button");
    const statusBox = document.getElementById("form-status");

    form.addEventListener("submit", function (event) {
      if (!form.checkValidity()) {
        return;
      }

      statusBox.textContent =
        "正在送出表單，請稍候。若首次使用，請依照 FormSubmit 寄出的驗證信完成設定。";

      statusBox.className = "form-status show info";
      button.disabled = true;
      button.textContent = "正在送出…";
    });
  </script>
</body>
</html>
