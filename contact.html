
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>聯絡我們｜1029作業</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header class="site-header">
    <a class="logo" href="index.html">1029作業</a>

    <nav>
      <a href="index.html">首頁</a>
      <a href="about.html">公司介紹</a>
      <a class="active" href="contact.html">聯絡我們</a>
    </nav>
  </header>

  <main class="page contact-page">
    <p class="eyebrow">CONTACT</p>
    <h1>聯絡我們</h1>
    <p class="lead">
      歡迎填寫以下表單，我們會盡快回覆您的訊息。
    </p>

    <form
      action="https://formsubmit.co/doratsai0711@gmail.com"
      method="POST"
      class="contact-form"
    >
      <!-- 郵件設定 -->
      <input
        type="hidden"
        name="_subject"
        value="1029作業｜收到新的聯絡表單"
      >

      <input
        type="hidden"
        name="_template"
        value="table"
      >

      <input
        type="hidden"
        name="_captcha"
        value="true"
      >

      <!-- 姓名 -->
      <label for="from_name">姓名 <span>*</span></label>
      <input
        id="from_name"
        name="姓名"
        type="text"
        autocomplete="name"
        required
        placeholder="請輸入姓名"
      >

      <!-- 電話 -->
      <label for="phone">電話 <span>*</span></label>
      <input
        id="phone"
        name="電話"
        type="tel"
        autocomplete="tel"
        required
        placeholder="請輸入聯絡電話"
      >

      <!-- Email -->
      <label for="reply_to">Email <span>*</span></label>
      <input
        id="reply_to"
        name="Email"
        type="email"
        autocomplete="email"
        required
        placeholder="請輸入電子郵件"
      >

      <!-- 聯絡內容 -->
      <label for="message">聯絡內容 <span>*</span></label>
      <textarea
        id="message"
        name="聯絡內容"
        rows="6"
        required
        placeholder="請輸入您想詢問的內容"
      ></textarea>

      <!-- 送出按鈕 -->
      <button class="button" type="submit">
        送出表單
      </button>

      <p class="form-note">
        感謝您的來信，我們將盡快處理。
        請勿填寫密碼或其他敏感個人資訊。
      </p>
    </form>
  </main>

  <footer>
    © 2026 1029作業｜All rights reserved.
  </footer>
</body>
</html>
